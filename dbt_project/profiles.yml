zomato_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('ZOMATO_DB_HOST', 'localhost') }}"
      port: "{{ env_var('ZOMATO_DB_PORT', '5432') | int }}"
      user: "{{ env_var('ZOMATO_DB_USER', 'zomato') }}"
      password: "{{ env_var('ZOMATO_DB_PASSWORD') }}"
      dbname: "{{ env_var('ZOMATO_DB_NAME', 'zomato') }}"
      schema: public
      threads: 4
      connect_timeout: 10
